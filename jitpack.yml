jdk:
  - openjdk21

before_install:
  - chmod +x gradlew
  # NOTE: no `git submodule update` here on purpose -- JitPack's detached
  # GIT_DIR setup breaks submodule plumbing. scripts/apply-patches.sh is
  # self-sufficient: it repairs missing/broken checkouts via an explicit
  # clone of the pinned revisions and then applies patches/*.patch.
  - sh scripts/apply-patches.sh
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
  # Best-effort only: the sdkmanager CLI crashes on newer JDKs (missing JAXB).
  # Missing packages are auto-installed by AGP from the pinned versions in
  # mediainfo-lib/build.gradle (ndkVersion / cmake version).
  - yes | sdkmanager --licenses > /dev/null || true
  - echo "y" | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" || true

# publishToMavenLocal is required: JitPack harvests artifacts from ~/.m2
# ("Looking for pom.xml in build directory and ~/.m2"). assembleRelease
# alone leaves the AAR only under mediainfo-lib/build and JitPack reports
# "No build artifacts found".
install:
  - ./gradlew :mediainfo-lib:assembleRelease :mediainfo-lib:publishToMavenLocal -x test --no-daemon --stacktrace
